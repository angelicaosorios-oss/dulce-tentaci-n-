<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galletas Dulce Rincón</title>
    <link rel="stylesheet" href="../css/galletas.css" />
    <link rel="stylesheet" href="visor3d.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <section class="presentacion">
      <div class="texto-presentacion"><h1>Nuestras Galletas</h1></div>
    </section>
    <main class="contenedor">
      <div class="productos">
        <!-- Los productos se cargan desde la base de datos (js/productos.js) -->
        <template data-categoria="Galletas" data-titulo="nombre">
          <div class="tarjeta">
            <div class="imagen-producto">
              <model-viewer
                data-campo="modelo"
                class="visor-producto"
                camera-controls
                auto-rotate
                rotation-per-second="60deg"
                ar
                shadow-intensity="5"
              ></model-viewer>
            </div>
            <div class="contenido-tarjeta">
              <h3 data-campo="nombre"></h3>
              <p data-campo="descripcion"></p>
              <span data-campo="precio" class="precio"></span>
              <a data-campo="agregar" class="button is-link" href="#">
                <h3>Agregar al carrito</h3>
              </a>
            </div>
          </div>
        </template>
      </div>
      <a class="button is -link" type="button" href="../html/index.php">
        <h3>inicio</h3>
      </a>
    </main>
    <script src="../js/carrito.js"></script>
    <script src="../js/productos.js"></script>
  </body>
</html>
