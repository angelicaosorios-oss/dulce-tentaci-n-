<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Carrito | Mi Dulce Rincón</title>

    <link rel="stylesheet" href="../css/carrito.css" />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ></script>

  </head>

  <body>
    <header class="encabezado">
      <h1>Mi carrito</h1>

      <a href="../html/index.html" class="seguir-comprando">
        Seguir comprando
      </a>
    </header>

    <main class="contenedor">
      <section class="productos-carrito">
        <h2>Productos seleccionados</h2>

        <div id="lista-carrito"></div>
      </section>

      <aside class="resumen">
        <h2>Resumen del pedido</h2>

        <div class="linea">
          <span>Subtotal</span>
          <span id="subtotal">$0</span>
        </div>

        <div class="linea">
          <span>Domicilio <small>(solo si eliges envío)</small></span>
          <span id="domicilio">$0</span>
        </div>

        <hr />

        <div class="total">
          <span>Total</span>
          <span id="total">$0</span>
        </div>

        <button class="btn-whatsapp" onclick="realizarPedido()">
          Realizar pedido
        </button>
      </aside>
    </main>

    <div id="carrito-vacio" class="carrito-vacio" style="display: none">
      <div class="icono-carrito"></div>

      <h2>Tu carrito está vacío</h2>

      <p>Todavía no has agregado ningún producto.</p>

      <a href="../html/index.html">Ver productos</a>
    </div>
    <script src="../js/medios.js"></script>
    <script src="../js/carrito.js"></script>
  </body>
</html>
