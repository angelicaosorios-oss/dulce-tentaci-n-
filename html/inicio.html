<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Inicio de sesión</title>

    <link rel="stylesheet" href="../css/inicio.css" />
  </head>

  <body>
    <div class="login-container">
      <h2>Iniciar sesión</h2>
      <h3>Ingresa tus datos para continuar</h3>
      <form id="formularioLogin" action="../php/inicio.php" method="POST">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="Ingresa tu correo"
          required
        />

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          required
        />

        <button type="submit">Iniciar sesión</button>
      </form>

      <p>
        ¿No tienes una cuenta?
        <a href="../html/registro.html">Regístrate</a>
      </p>
    </div>

    <div id="mensaje" class="mensaje">
      <div class="mensaje-contenido">
        <span id="icono-mensaje"></span>

        <h3 id="titulo-mensaje"></h3>

        <p id="texto-mensaje"></p>

        <button id="cerrar-mensaje">Aceptar</button>
      </div>
    </div>

    <script src="../html/index.html"></script>

    <script src="../js/inicio.js"></script>
  </body>
</html>
