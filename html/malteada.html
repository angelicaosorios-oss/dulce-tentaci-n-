<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malteadas - Dulce Rincón</title>
    <link rel="stylesheet" href="../css/malteadas.css" />
    <link rel="stylesheet" href="visor3d.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <section class="seccion-malteadas">
      <div class="titulo-malteadas">
        <h2>Nuestras Malteadas</h2>
      </div>

      <div class="contenedor-malteadas">
        <!-- Los productos se cargan desde la base de datos (js/productos.js) -->
        <template data-categoria="Malteadas" data-titulo="sabor">
          <div class="tarjeta-malteada">
            <model-viewer
              data-campo="modelo"
              class="visor-producto"
              camera-controls
              auto-rotate
              rotation-per-second="60deg"
              ar
              shadow-intensity="9"
              
            ></model-viewer>
            <div class="contenido-malteada">
              <h3 data-campo="nombre"></h3>
              <p data-campo="descripcion"></p>
              <span data-campo="precio"></span>
              <a data-campo="agregar" class="button is-link" href="#">
                <h3>Agregar al carrito</h3>
              </a>
            </div>
          </div>
        </template>
      </div>

      <div class="boton-inicio">
        <a class="button is -link" type="button" href="../html/index.php">
          <h3>inicio</h3>
        </a>
      </div>
    </section>
    <script src="../js/carrito.js"></script>
    <script src="../js/productos.js"></script>
  </body>
</html>
