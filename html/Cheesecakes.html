<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cheesecakes - dulcetentacion</title>

    <link rel="stylesheet" href="../css/Cheesecakes.css" />
    <link rel="stylesheet" href="visor3d.css" />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ></script>
  </head>

  <body>
    <section id="cheesecakes">
      <h2>Nuestros Cheesecakes</h2>

      <div class="productos">
        <!-- Los productos se cargan desde la base de datos (js/productos.js) -->
        <template data-categoria="Cheesecakes" data-titulo="nombre">
          <div class="tarjeta">
            <model-viewer
              data-campo="modelo"
              class="visor-producto"
              camera-controls
              auto-rotate
              rotation-per-second="60deg"
              ar
              shadow-intensity="5"
            ></model-viewer>
            <h3 data-campo="nombre"></h3>
            <p data-campo="descripcion"></p>
            <h4 data-campo="precio"></h4>
            <a data-campo="agregar" class="button is-link" href="#">
              <h3>Agregar al carrito</h3>
            </a>
          </div>
        </template>
      </div>

      <a class="button is-link" href="../html/index.php">
        <h3>Inicio</h3>
      </a>
    </section>
    <script src="../js/carrito.js"></script>
    <script src="../js/productos.js"></script>
  </body>
</html>
