<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/contacto.css" />
  </head>
  <body>
    <main class="contacto">
      <section class="formulario">
        <div class="titulo">
          <h1>Contacto</h1>
          <a href="../html/inicio.html">Iniciar sesión</a>
        </div>

        <form id="formulario-contacto" action="../php/contacto.php" method="POST">
          <div class="campo">
            <input
              type="email"
              name="correo_electronico"
              placeholder="Correo electrónico"
              required
            />
          </div>

          <label class="check">
            <input type="checkbox" name="novedades" />
            Enviarme novedades y ofertas por correo electrónico
          </label>

          <h2>Datos de contacto</h2>

          <div class="fila">
            <input type="text" name="nombre" placeholder="Nombre" required />

            <input
              type="text"
              name="apellidos"
              placeholder="Apellidos"
              required
            />
          </div>

          <input type="text" name="telefono" placeholder="Teléfono" required />

          <input
            type="text"
            name="direccion"
            placeholder="Dirección"
            required
          />

          <input type="text" name="ciudad" placeholder="Ciudad" required />

          <textarea
            name="mensaje"
            placeholder="Escribe aquí tu mensaje o solicitud"
          ></textarea>

          <h2>Forma de entrega</h2>

          <div class="entrega">
            <label>
              <input type="radio" name="forma_entrega" value="Envio" required />
              Envío
            </label>

            <label>
              <input type="radio" name="forma_entrega" value="Recoger" />
              Recoger
            </label>
          </div>

          <h2>Pago</h2>

          <p class="seguridad">
            Tus datos están protegidos y son utilizados únicamente para procesar
            tu pedido.
          </p>

          <select name="metodo_pago" required>
            <option value="">Selecciona un método de pago</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Nequi">Nequi</option>
            <option value="Daviplata">Daviplata</option>
            <option value="Efectivo">Efectivo</option>
          </select>

          <button type="submit" class="pagar">Enviar pedido</button>
        </form>
      </section>

      <!-- Conserva aquí tu sección resumen del pedido -->
    </main>
    <div id="mensaje" class="mensaje">
      <div class="mensaje-contenido">
        <span id="icono-mensaje"></span>

        <h3 id="titulo-mensaje"></h3>

        <p id="texto-mensaje"></p>

        <button id="cerrar-mensaje">Aceptar</button>
      </div>
    </div>

    <script src="../js/contacto.js"></script>
  </body>
</html>
