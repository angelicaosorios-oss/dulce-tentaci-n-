<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear producto | Dulce Rincón</title>

    <link rel="stylesheet"
          href="crear productos.css">

</head>


<body>


    <aside class="sidebar">

        <div class="logo">
             <span>Dulce Rincón</span>
        </div>

        <p class="subtitulo">
            Panel de administración
        </p>


        <nav>

            <a href="/administrador.html">
                 Inicio
            </a>

            <a href="/index.html" class="activo">
                 Productos
            </a>

            <a href="/categoria.html">
                 Categorías
            </a>

            <a href="pedidos.html">
                 Pedidos
            </a>

            <a href="clientes.html">
                 Clientes
            </a>


        </nav>


        <a href="/inicio.html" class="cerrar">
             Cerrar sesión
        </a>

    </aside>

    <main class="contenido">


        <header class="barra">

            <div class="nombre">
                 <i>Dulce Rincón</i>
            </div>


            <div class="usuario">


            </div>

        </header>


        <section class="formulario">


            <div class="titulo">

                <h1>Crear producto</h1>

                <p>
                    Agrega un nuevo producto a tu tienda.
                </p>

            </div>


            <form id="formProducto">

                <label>
                    Nombre del producto
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej: Torta de chocolate"
                    required
                >

                <label>
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    placeholder="Describe el producto..."
                    required
                ></textarea>

                <label>
                    Precio
                </label>

                <input
                    type="number"
                    id="precio"
                    placeholder="$ 0"
                    required
                >

                <label>
                    Categoría
                </label>

                <select id="categoria" required>

                    <option value="">
                        Selecciona una categoría
                    </option>

                    <option value="tortas">
                        Tortas
                    </option>

                    <option value="cupcakes">
                        Cupcakes
                    </option>

                    <option value="postres">
                        Postres
                    </option>

                    <option value="galletas">
                        Galletas
                    </option>

                </select>


                <label>
                    Imagen del producto
                </label>

                <div class="subir-imagen">

                    <span></span>

                    <p>
                        Selecciona una imagen
                    </p>

                    <small>
                        PNG, JPG o JPEG
                    </small>

                    <input
                        type="file"
                        id="imagen"
                        accept="image/png, image/jpeg"
                    >

                </div>


                <div class="botones">

                    <a href="productos.html"
                       class="cancelar">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="guardar">
                        GUARDAR PRODUCTO
                    </button>

                </div>


            </form>

        </section>

    </main>

    <script src="/crear productos.js"></script>

</body>

</html>
