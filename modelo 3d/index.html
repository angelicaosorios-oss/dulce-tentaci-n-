<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dulce Rincón - Malteada 3D</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

<a-scene background="color: #fff8f5">

    <a-assets>
        <img id="malteada" src="AQUI-PONES-LA-URL-DE-TU-IMAGEN">
    </a-assets>

    <a-entity
        geometry="primitive: cylinder; height: 0.1; radius: 1.8"
        position="0 0 -3"
        material="color: #4a2c2a"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;">
        
        <a-plane
            src="#malteada"
            position="0 1.2 0"
            width="2"
            height="2.5"
            material="transparent: true;">
        </a-plane>

    </a-entity>

    <a-entity
        camera
        position="0 1.6 2"
        look-controls
        wasd-controls>
    </a-entity>

    <a-entity
        light="type: ambient; intensity: 1"
        position="0 3 2">
    </a-entity>

    <a-entity
        light="type: point; intensity: 3"
        position="0 3 1">
    </a-entity>

</a-scene>

</body>
</html>
