<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galletas Mi Dulce Rincón</title>
    <link rel="stylesheet" href="galletas.css" />
  </head>
  <body>
    <section class="presentacion">
      <div class="texto-presentacion"><h1>Nuestras Galletas</h1></div>
    </section>
    <main class="contenedor">
      <div class="productos">
        <div class="tarjeta">
          <div class="imagen-producto">
            <img
              src="https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=600&q=80"
              alt="Galleta de Chocolate"
            />
          </div>

          <div class="contenido-tarjeta">
            <h3>Galleta de Chocolate</h3>
            <p>Galleta suave con deliciosos trozos de chocolate.</p>
            <span class="precio">$5.000</span>
            <button>Agregar al pedido</button>
          </div>
        </div>

        <div class="tarjeta">
          <div class="imagen-producto">
            <img
              src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80"
              alt="galleta de dinosaurio"
            />
          </div>

          <div class="contenido-tarjeta">
            <h3>galleta de dinosaurio</h3>
            <p>Galleta de red velvet con un sabor dulce y especial.</p>
            <span class="precio">$5.500</span>
            <button>Agregar al pedido</button>
          </div>
        </div>

        <div class="tarjeta">
          <div class="imagen-producto">
            <img
              src="https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=600&q=80"
              alt="Oreo"
            />
          </div>

          <div class="contenido-tarjeta">
            <h3>Oreo</h3>
            <p>
              Deliciosa galleta con sabor a Oreo, perfecta para los amantes del
              chocolate.
            </p>
            <span class="precio">$5.000</span>
            <button>Agregar al pedido</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
